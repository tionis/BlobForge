[project]
name = "blobforge-marker2-adapter"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "marker-pdf==2.0.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
