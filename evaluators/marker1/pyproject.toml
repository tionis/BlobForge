[project]
name = "blobforge-marker1-adapter"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "marker-pdf==1.10.2",
    "torch==2.10.0",
]

[tool.uv]
package = false
override-dependencies = ["pillow>=12.2.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
